server:
  port: 8080

spring:
  application:
    name: studyflow-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/studyflow?currentSchema=app}
    username: ${DATABASE_USERNAME:studyflow}
    password: ${DATABASE_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: app
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    schemas: app
    default-schema: app
    baseline-on-migrate: true
    table: flyway_schema_history
    locations: classpath:db/migration

studyflow:
  jwt:
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
