<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1890" viewBox="0 0 1280 1890" role="img" aria-labelledby="title desc">
<title id="title">Hình 3.2 · Upload và lập chỉ mục Personal PDF</title><desc id="desc">Luồng thiết kế theo contract StudyFlow, chưa phải minh chứng thực thi. Cột trái là luồng chính; cột phải là nhánh lỗi hoặc thao tác thay thế.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#536474" stroke-width="2"/></marker></defs>
<style>text{font-family:Arial,Segoe UI,sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:16px;fill:#526273}.actor{font-size:13px;font-weight:700;fill:#a80f18}.node{font-size:20px;font-weight:700}.body{font-size:16px}.side{font-size:17px;font-weight:700}.label{font-size:13px;fill:#526273}</style>
<rect width="1280" height="1890" fill="white"/>
<rect width="1280" height="8" fill="#d71920"/>
<text x="48" y="52" class="title">Hình 3.2 · Upload và lập chỉ mục Personal PDF</text>
<text x="48" y="83" class="sub">Đối chiếu mục 3.2.2 · Luồng dự kiến theo API/thiết kế hiện hành · Chưa xác minh runtime</text>
<text x="48" y="112" class="sub">Luồng chính đi xuống khi điều kiện hợp lệ; nhánh bên phải ghi kết quả lỗi hoặc thao tác thay thế.</text><g><rect x="48" y="145" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="159" width="4" height="97" fill="#16806b"/>
<text x="68" y="170" class="actor">01 · Student / Web</text>
<text x="68" y="199" class="node">Gửi PDF cá nhân</text><text x="68" y="227" class="body">POST /api/v1/personal-documents</text></g><path d="M393 271V309" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="315" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="329" width="4" height="97" fill="#d71920"/>
<text x="68" y="340" class="actor">02 · Java</text>
<text x="68" y="369" class="node">Kiểm tra file và tài khoản</text><text x="68" y="397" class="body">PDF · MIME thực · giới hạn 20 MB</text></g><path d="M393 441V479" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><path d="M738 378H800" fill="none" stroke="#536474" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="810" y="315" width="420" height="126" rx="12" fill="#fff5e9" stroke="#ddba8b"/><text x="826" y="340" class="side">File sai hoặc quá lớn</text><text x="826" y="368" class="body">Trả 415 / 422 / 413; không index.</text><g><rect x="48" y="485" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="499" width="4" height="97" fill="#d71920"/>
<text x="68" y="510" class="actor">03 · Java / Storage / app</text>
<text x="68" y="539" class="node">Lưu file và metadata</text><text x="68" y="567" class="body">PENDING_PROCESSING; enqueue yêu cầu index</text></g><path d="M393 611V649" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="655" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="669" width="4" height="97" fill="#d71920"/>
<text x="68" y="680" class="actor">04 · Java → Web</text>
<text x="68" y="709" class="node">Trả sớm 202 Accepted</text><text x="68" y="737" class="body">documentId + trạng thái; Web poll qua Java</text></g><path d="M393 781V819" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="825" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="839" width="4" height="97" fill="#2563a6"/>
<text x="68" y="850" class="actor">05 · Java → Python</text>
<text x="68" y="879" class="node">Gửi yêu cầu index có scope</text><text x="68" y="907" class="body">POST /internal/v1/documents/index; Idempotency-Key</text></g><path d="M393 951V989" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="995" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="1009" width="4" height="97" fill="#2563a6"/>
<text x="68" y="1020" class="actor">06 · Python → Java</text>
<text x="68" y="1049" class="node">Nhận job, trả 202 + jobId</text><text x="68" y="1077" class="body">Python Worker xử lý nền; không giữ HTTP chờ hoàn tất</text></g><path d="M393 1121V1159" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="1165" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="1179" width="4" height="97" fill="#2563a6"/>
<text x="68" y="1190" class="actor">07 · Python Worker</text>
<text x="68" y="1219" class="node">Extract → chunk theo trang</text><text x="68" y="1247" class="body">Giữ document/version/owner/page/chunk</text></g><path d="M393 1291V1329" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><path d="M738 1228H800" fill="none" stroke="#536474" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="810" y="1165" width="420" height="126" rx="12" fill="#fff5e9" stroke="#ddba8b"/><text x="826" y="1190" class="side">Parsing thất bại</text><text x="826" y="1218" class="body">PDF_ENCRYPTED / PDF_TEXT_REQUIRED; lưu job thất</text><text x="826" y="1238" class="body">bại.</text><g><rect x="48" y="1335" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="1349" width="4" height="97" fill="#2563a6"/>
<text x="68" y="1360" class="actor">08 · Python / Model / ai</text>
<text x="68" y="1389" class="node">Embedding và lưu index</text><text x="68" y="1417" class="body">Query/chunk phải cùng model, dimensions, index version</text></g><path d="M393 1461V1499" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><path d="M738 1398H800" fill="none" stroke="#536474" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="810" y="1335" width="420" height="126" rx="12" fill="#fff5e9" stroke="#ddba8b"/><text x="826" y="1360" class="side">Lỗi xử lý</text><text x="826" y="1388" class="body">Retry theo policy có giới hạn; không nhân bản</text><text x="826" y="1408" class="body">chunk.</text><g><rect x="48" y="1505" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="1519" width="4" height="97" fill="#2563a6"/>
<text x="68" y="1530" class="actor">09 · Java → Python</text>
<text x="68" y="1559" class="node">Poll job có backoff</text><text x="68" y="1587" class="body">GET /internal/v1/jobs/{jobId}; chờ trạng thái kết thúc</text></g><path d="M393 1631V1669" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="1675" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="1689" width="4" height="97" fill="#d71920"/>
<text x="68" y="1700" class="actor">10 · Java / app → Web</text>
<text x="68" y="1729" class="node">Cập nhật READY hoặc FAILED</text><text x="68" y="1757" class="body">Web GET /personal-documents/{id}/status</text></g><path d="M738 1738H800" fill="none" stroke="#536474" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="810" y="1675" width="420" height="126" rx="12" fill="#fff5e9" stroke="#ddba8b"/><text x="826" y="1700" class="side">Document READY</text><text x="826" y="1728" class="body">Owner có thể chọn cho Personal RAG hoặc tạo</text><text x="826" y="1748" class="body">Quiz.</text><text x="48" y="1874" class="label">Public API viết tương đối với /api/v1 khi lược prefix; internal API dùng /internal/v1. Java sở hữu quyền và trạng thái nghiệp vụ.</text></svg>
