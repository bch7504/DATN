server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: studyflow-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/studyflow?currentSchema=app}
    username: ${DATABASE_USERNAME:studyflow}
    password: ${DATABASE_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: app
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    create-schemas: true
    default-schema: app
    schemas: app
    baseline-on-migrate: true
    table: flyway_schema_history
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO

studyflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    expiration-ms: 86400000
  notifications:
    reminder-scan-delay: ${STUDYFLOW_REMINDER_SCAN_DELAY:60000}
  auth:
    allowed-email-domain: ${STUDYFLOW_ALLOWED_EMAIL_DOMAIN:ptit.edu.vn}
    otp-ttl: ${STUDYFLOW_OTP_TTL:10m}
    resend-cooldown: ${STUDYFLOW_OTP_RESEND_COOLDOWN:60s}
    max-verification-attempts: ${STUDYFLOW_OTP_MAX_ATTEMPTS:5}
    access-token-ttl: ${STUDYFLOW_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${STUDYFLOW_REFRESH_TOKEN_TTL:30d}
    jwt-issuer: ${STUDYFLOW_JWT_ISSUER:studyflow}
    jwt-secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    cookie-secure: ${STUDYFLOW_COOKIE_SECURE:false}
    mail-from: ${MAIL_FROM:noreply@ptit.edu.vn}
