spring:
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:local}
    password: ${MAIL_PASSWORD:local}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

studyflow:
  auth:
    cookie-secure: false
  cors:
    allowed-origins: ${STUDYFLOW_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
