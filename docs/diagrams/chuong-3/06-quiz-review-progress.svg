<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1890" viewBox="0 0 1280 1890" role="img" aria-labelledby="title desc">
<title id="title">Hình 3.7 · Làm Quiz, ôn lại và cập nhật Dashboard</title><desc id="desc">Luồng thiết kế theo contract StudyFlow, chưa phải minh chứng thực thi. Cột trái là luồng chính; cột phải là nhánh lỗi hoặc thao tác thay thế.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#536474" stroke-width="2"/></marker></defs>
<style>text{font-family:Arial,Segoe UI,sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:16px;fill:#526273}.actor{font-size:13px;font-weight:700;fill:#a80f18}.node{font-size:20px;font-weight:700}.body{font-size:16px}.side{font-size:17px;font-weight:700}.label{font-size:13px;fill:#526273}</style>
<rect width="1280" height="1890" fill="white"/>
<rect width="1280" height="8" fill="#d71920"/>
<text x="48" y="52" class="title">Hình 3.7 · Làm Quiz, ôn lại và cập nhật Dashboard</text>
<text x="48" y="83" class="sub">Đối chiếu mục 3.4.6–3.4.8 · Luồng dự kiến theo API/thiết kế hiện hành · Chưa xác minh runtime</text>
<text x="48" y="112" class="sub">Luồng chính đi xuống khi điều kiện hợp lệ; nhánh bên phải ghi kết quả lỗi hoặc thao tác thay thế.</text><g><rect x="48" y="145" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="159" width="4" height="97" fill="#d71920"/>
<text x="68" y="170" class="actor">01 · Student / Web → Java</text>
<text x="68" y="199" class="node">Bắt đầu Quiz READY thuộc owner</text><text x="68" y="227" class="body">POST /review/quizzes/{id}/attempts</text></g><path d="M393 271V309" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="315" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="329" width="4" height="97" fill="#d71920"/>
<text x="68" y="340" class="actor">02 · Java / app → Web</text>
<text x="68" y="369" class="node">Tạo attempt mới</text><text x="68" y="397" class="body">Trả câu hỏi và options; không gửi answer key</text></g><path d="M393 441V479" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="485" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="499" width="4" height="97" fill="#d71920"/>
<text x="68" y="510" class="actor">03 · Student / Web → Java</text>
<text x="68" y="539" class="node">Submit lựa chọn</text><text x="68" y="567" class="body">POST /review/attempts/{id}/submit</text></g><path d="M393 611V649" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><path d="M738 548H800" fill="none" stroke="#536474" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="810" y="485" width="420" height="126" rx="12" fill="#fff5e9" stroke="#ddba8b"/><text x="826" y="510" class="side">Payload không hợp lệ</text><text x="826" y="538" class="body">Sai owner/question/option/state → từ chối; không</text><text x="826" y="558" class="body">chấm theo dữ liệu client tự tính.</text><g><rect x="48" y="655" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="669" width="4" height="97" fill="#d71920"/>
<text x="68" y="680" class="actor">04 · Java / app</text>
<text x="68" y="709" class="node">Chấm bài trong transaction</text><text x="68" y="737" class="body">Đáp án chuẩn phía server; lưu quiz_answers + quiz_attempts</text></g><path d="M393 781V819" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><path d="M738 718H800" fill="none" stroke="#536474" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="810" y="655" width="420" height="126" rx="12" fill="#fff5e9" stroke="#ddba8b"/><text x="826" y="680" class="side">Submit bị gửi lặp</text><text x="826" y="708" class="body">Không ghi đè attempt đã hoàn tất; không phát</text><text x="826" y="728" class="body">event trùng.</text><g><rect x="48" y="825" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="839" width="4" height="97" fill="#d71920"/>
<text x="68" y="850" class="actor">05 · Java / app</text>
<text x="68" y="879" class="node">Ghi QUIZ_COMPLETED một lần</text><text x="68" y="907" class="body">quantity = số câu trong attempt đã chấm</text></g><path d="M393 951V989" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><path d="M738 888H800" fill="none" stroke="#536474" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="810" y="825" width="420" height="126" rx="12" fill="#fff5e9" stroke="#ddba8b"/><text x="826" y="850" class="side">Dashboard đọc và tổng hợp</text><text x="826" y="878" class="body">VIEW_SLIDE / STUDY_TASK_COMPLETED /</text><text x="826" y="898" class="body">QUIZ_COMPLETED → actual Daily Goal + Streak theo</text><text x="826" y="918" class="body">local date.</text><g><rect x="48" y="995" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="1009" width="4" height="97" fill="#d71920"/>
<text x="68" y="1020" class="actor">06 · Java → Student</text>
<text x="68" y="1049" class="node">Trả điểm và lịch sử</text><text x="68" y="1077" class="body">Các attempt cũ được giữ nguyên</text></g><path d="M393 1121V1159" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="1165" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="1179" width="4" height="97" fill="#d71920"/>
<text x="68" y="1190" class="actor">07 · Java / app → Review Hub</text>
<text x="68" y="1219" class="node">Tổng hợp câu sai và nguồn</text><text x="68" y="1247" class="body">quiz_answers → quiz_questions → quiz_question_sources</text></g><path d="M393 1291V1329" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="1335" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="1349" width="4" height="97" fill="#d71920"/>
<text x="68" y="1360" class="actor">08 · Student / Java</text>
<text x="68" y="1389" class="node">Mở nguồn Personal PDF theo trang</text><text x="68" y="1417" class="body">Kiểm tra lại quyền trước khi mở</text></g><path d="M393 1461V1499" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><path d="M738 1398H800" fill="none" stroke="#536474" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="810" y="1335" width="420" height="126" rx="12" fill="#fff5e9" stroke="#ddba8b"/><text x="826" y="1360" class="side">Nguồn đã xóa / mất quyền</text><text x="826" y="1388" class="body">Hiển thị nguồn không khả dụng; không vượt kiểm</text><text x="826" y="1408" class="body">tra quyền.</text><g><rect x="48" y="1505" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="1519" width="4" height="97" fill="#d71920"/>
<text x="68" y="1530" class="actor">09 · Student / Web → Java</text>
<text x="68" y="1559" class="node">Ôn lại và làm Quiz lần nữa</text><text x="68" y="1587" class="body">Tạo attempt mới qua cùng endpoint; không sửa attempt cũ</text></g><path d="M393 1631V1669" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="1675" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="1689" width="4" height="97" fill="#16806b"/>
<text x="68" y="1700" class="actor">10 · Student</text>
<text x="68" y="1729" class="node">So sánh các lần làm</text><text x="68" y="1757" class="body">Không dùng AI suy luận yếu/mạnh hoặc Topic Mastery</text></g><text x="48" y="1874" class="label">Public API viết tương đối với /api/v1 khi lược prefix; internal API dùng /internal/v1. Java sở hữu quyền và trạng thái nghiệp vụ.</text></svg>
