<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="966" viewBox="0 0 1600 966">
  <defs>
    <style>
      text { font-family: Arial, 'DejaVu Sans', sans-serif; fill: #132d3b; }
      .title { font-size: 32px; font-weight: 700; }
      .name { font-size: 25px; font-weight: 700; }
      .kind { font-size: 18px; font-style: italic; }
      .item { font-size: 22px; }
      .note { font-size: 20px; font-style: italic; }
      .box { fill: #83c9e8; stroke: #315a71; stroke-width: 3; }
      .split { stroke: #315a71; stroke-width: 2; }
      .arrow { fill: none; stroke: #203e4d; stroke-width: 3; marker-end: url(#tip); }
    </style>
    <marker id="tip" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#203e4d"/></marker>
  </defs>
  <rect x="1" y="1" width="1598" height="964" fill="white"/>
  <text x="800" y="58" text-anchor="middle" class="title">BE2-F01 — Quản lý bài tập và bài nộp</text>

  <rect x="45" y="118" width="460" height="218" class="box"/>
  <text x="275" y="147" text-anchor="middle" class="kind">«giao diện»</text>
  <text x="275" y="181" text-anchor="middle" class="name">TeacherAssignmentController</text>
  <line x1="45" y1="197" x2="505" y2="197" class="split"/>
  <text x="66" y="235" class="item">+ tạo và công bố bài tập()</text>
  <text x="66" y="272" class="item">+ xem danh sách bài nộp()</text>
  <text x="66" y="309" class="item">+ xem thống kê sau hạn()</text>

  <rect x="570" y="118" width="460" height="218" class="box"/>
  <text x="800" y="147" text-anchor="middle" class="kind">«xử lý»</text>
  <text x="800" y="181" text-anchor="middle" class="name">AssignmentService</text>
  <line x1="570" y1="197" x2="1030" y2="197" class="split"/>
  <text x="591" y="235" class="item">+ kiểm tra lớp và quyền()</text>
  <text x="591" y="272" class="item">+ lưu bài nộp hiện tại()</text>
  <text x="591" y="309" class="item">+ tổng hợp tình trạng nộp()</text>

  <rect x="1095" y="118" width="460" height="218" class="box"/>
  <text x="1325" y="147" text-anchor="middle" class="kind">«giao diện»</text>
  <text x="1325" y="181" text-anchor="middle" class="name">StudentAssignmentController</text>
  <line x1="1095" y1="197" x2="1555" y2="197" class="split"/>
  <text x="1116" y="235" class="item">+ xem bài đã công bố()</text>
  <text x="1116" y="272" class="item">+ nộp văn bản hoặc tệp()</text>
  <text x="1116" y="309" class="item">+ xem bài nộp của mình()</text>

  <path d="M505 225 L570 225" class="arrow"/>
  <path d="M1095 225 L1030 225" class="arrow"/>

  <rect x="45" y="454" width="460" height="198" class="box"/>
  <text x="275" y="484" text-anchor="middle" class="kind">«dữ liệu»</text>
  <text x="275" y="519" text-anchor="middle" class="name">CourseAssignment</text>
  <line x1="45" y1="536" x2="505" y2="536" class="split"/>
  <text x="66" y="572" class="item">- lớp, giảng viên, hạn nộp</text>
  <text x="66" y="609" class="item">- DRAFT / PUBLISHED</text>

  <rect x="570" y="454" width="460" height="198" class="box"/>
  <text x="800" y="484" text-anchor="middle" class="kind">«dữ liệu»</text>
  <text x="800" y="519" text-anchor="middle" class="name">AssignmentSubmission</text>
  <line x1="570" y1="536" x2="1030" y2="536" class="split"/>
  <text x="591" y="572" class="item">- bài tập, sinh viên, giờ nộp</text>
  <text x="591" y="609" class="item">- đúng hạn / nộp muộn</text>

  <rect x="1095" y="454" width="460" height="198" class="box"/>
  <text x="1325" y="484" text-anchor="middle" class="kind">«dữ liệu»</text>
  <text x="1325" y="519" text-anchor="middle" class="name">AssignmentSubmissionAttachment</text>
  <line x1="1095" y1="536" x2="1555" y2="536" class="split"/>
  <text x="1116" y="572" class="item">- bài nộp, tên tệp, khóa lưu</text>
  <text x="1116" y="609" class="item">- nộp lại thay tệp cũ</text>

  <path d="M720 336 L275 454" class="arrow"/>
  <path d="M800 336 L800 454" class="arrow"/>
  <path d="M880 336 L1325 454" class="arrow"/>
  <path d="M505 575 L570 575" class="arrow"/>
  <path d="M1030 575 L1095 575" class="arrow"/>

  <rect x="570" y="738" width="460" height="128" class="box"/>
  <text x="800" y="769" text-anchor="middle" class="kind">«tác vụ»</text>
  <text x="800" y="804" text-anchor="middle" class="name">AssignmentReminderJob</text>
  <line x1="570" y1="819" x2="1030" y2="819" class="split"/>
  <text x="591" y="852" class="item">+ nhắc người chưa nộp trước hạn()</text>
  <path d="M800 652 L800 738" class="arrow"/>
  <text x="800" y="922" text-anchor="middle" class="note">Giảng viên theo dõi số lượng và danh sách nộp bài sau hạn.</text>
</svg>
