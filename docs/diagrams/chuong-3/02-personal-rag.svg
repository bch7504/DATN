<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1890" viewBox="0 0 1280 1890" role="img" aria-labelledby="title desc">
<title id="title">Hình 3.3 · Hỏi đáp Personal RAG</title><desc id="desc">Luồng thiết kế theo contract StudyFlow, chưa phải minh chứng thực thi. Cột trái là luồng chính; cột phải là nhánh lỗi hoặc thao tác thay thế.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#536474" stroke-width="2"/></marker></defs>
<style>text{font-family:Arial,Segoe UI,sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.sub{font-size:16px;fill:#526273}.actor{font-size:13px;font-weight:700;fill:#a80f18}.node{font-size:20px;font-weight:700}.body{font-size:16px}.side{font-size:17px;font-weight:700}.label{font-size:13px;fill:#526273}</style>
<rect width="1280" height="1890" fill="white"/>
<rect width="1280" height="8" fill="#d71920"/>
<text x="48" y="52" class="title">Hình 3.3 · Hỏi đáp Personal RAG</text>
<text x="48" y="83" class="sub">Đối chiếu mục 3.2.3–3.2.5 · Luồng dự kiến theo API/thiết kế hiện hành · Chưa xác minh runtime</text>
<text x="48" y="112" class="sub">Luồng chính đi xuống khi điều kiện hợp lệ; nhánh bên phải ghi kết quả lỗi hoặc thao tác thay thế.</text><g><rect x="48" y="145" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="159" width="4" height="97" fill="#16806b"/>
<text x="68" y="170" class="actor">01 · Student / Web</text>
<text x="68" y="199" class="node">Chọn 1–10 PDF READY</text><text x="68" y="227" class="body">POST /personal-rag/conversations {selectedDocumentIds}</text></g><path d="M393 271V309" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="315" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="329" width="4" height="97" fill="#d71920"/>
<text x="68" y="340" class="actor">02 · Java / app</text>
<text x="68" y="369" class="node">Kiểm tra owner, version, READY</text><text x="68" y="397" class="body">Lưu conversation và snapshot nguồn được phép</text></g><path d="M393 441V479" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><path d="M738 378H800" fill="none" stroke="#536474" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="810" y="315" width="420" height="126" rx="12" fill="#fff5e9" stroke="#ddba8b"/><text x="826" y="340" class="side">Scope không hợp lệ</text><text x="826" y="368" class="body">Từ chối toàn bộ request; không gửi ID trái phép</text><text x="826" y="388" class="body">sang AI.</text><g><rect x="48" y="485" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="499" width="4" height="97" fill="#d71920"/>
<text x="68" y="510" class="actor">03 · Student / Web → Java</text>
<text x="68" y="539" class="node">Gửi câu hỏi trong conversation</text><text x="68" y="567" class="body">POST /personal-rag/conversations/{id}/messages {message}</text></g><path d="M393 611V649" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="655" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="669" width="4" height="97" fill="#d71920"/>
<text x="68" y="680" class="actor">04 · Java</text>
<text x="68" y="709" class="node">Đọc lại quyền và snapshot scope</text><text x="68" y="737" class="body">Không tin scope tự khai của client; kiểm tra trước mỗi message</text></g><path d="M393 781V819" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="825" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="839" width="4" height="97" fill="#2563a6"/>
<text x="68" y="850" class="actor">05 · Python / pgvector</text>
<text x="68" y="879" class="node">Embed query và retrieval có filter</text><text x="68" y="907" class="body">owner + document/version/source; giữ một evidence snapshot</text></g><path d="M393 951V989" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="995" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="1009" width="4" height="97" fill="#2563a6"/>
<text x="68" y="1020" class="actor">06 · Python</text>
<text x="68" y="1049" class="node">Evidence đủ để trả lời?</text><text x="68" y="1077" class="body">Có → sinh câu trả lời; không → dừng</text></g><path d="M393 1121V1159" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><path d="M738 1058H800" fill="none" stroke="#536474" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="810" y="995" width="420" height="126" rx="12" fill="#fff5e9" stroke="#ddba8b"/><text x="826" y="1020" class="side">Không đủ evidence</text><text x="826" y="1048" class="body">Trả NO_EVIDENCE trước khi gọi LLM để generation.</text><g><rect x="48" y="1165" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="1179" width="4" height="97" fill="#2563a6"/>
<text x="68" y="1190" class="actor">07 · Python / LLM</text>
<text x="68" y="1219" class="node">Sinh draft từ evidence</text><text x="68" y="1247" class="body">Lịch sử có giới hạn; tài liệu/prompt là dữ liệu không tin cậy</text></g><path d="M393 1291V1329" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="48" y="1335" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="1349" width="4" height="97" fill="#2563a6"/>
<text x="68" y="1360" class="actor">08 · Python</text>
<text x="68" y="1389" class="node">Grounding và citation theo claim</text><text x="68" y="1417" class="body">Cùng evidence snapshot; rewrite tối đa một lần</text></g><path d="M393 1461V1499" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><path d="M738 1398H800" fill="none" stroke="#536474" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="810" y="1335" width="420" height="126" rx="12" fill="#fff5e9" stroke="#ddba8b"/><text x="826" y="1360" class="side">Grounding vẫn không đạt</text><text x="826" y="1388" class="body">Loại claim không có căn cứ; không còn câu trả</text><text x="826" y="1408" class="body">lời hợp lệ → NO_EVIDENCE.</text><g><rect x="48" y="1505" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="1519" width="4" height="97" fill="#d71920"/>
<text x="68" y="1530" class="actor">09 · Java / app</text>
<text x="68" y="1559" class="node">Validate schema và citation</text><text x="68" y="1587" class="body">Kiểm tra scope; lưu message và citation hợp lệ</text></g><path d="M393 1631V1669" fill="none" stroke="#536474" stroke-width="2" marker-end="url(#arrow)"/><path d="M738 1568H800" fill="none" stroke="#536474" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="810" y="1505" width="420" height="126" rx="12" fill="#fff5e9" stroke="#ddba8b"/><text x="826" y="1530" class="side">Output sai hoặc AI lỗi</text><text x="826" y="1558" class="body">Trả lỗi an toàn; không coi lỗi hạ tầng là</text><text x="826" y="1578" class="body">NO_EVIDENCE.</text><g><rect x="48" y="1675" width="690" height="126" rx="12" fill="#f8fafc" stroke="#c8d2dc" stroke-width="1.5"/>
<rect x="48" y="1689" width="4" height="97" fill="#16806b"/>
<text x="68" y="1700" class="actor">10 · Web / Student</text>
<text x="68" y="1729" class="node">Hiển thị ANSWERED hoặc NO_EVIDENCE</text><text x="68" y="1757" class="body">Citation: documentId + pageNumber + excerpt + traceId</text></g><text x="48" y="1874" class="label">Public API viết tương đối với /api/v1 khi lược prefix; internal API dùng /internal/v1. Java sở hữu quyền và trạng thái nghiệp vụ.</text></svg>
