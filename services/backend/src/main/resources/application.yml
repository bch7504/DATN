spring:
  application:
    name: studyflow-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/studyflow?currentSchema=app}
    username: ${DATABASE_USERNAME:studyflow}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
  flyway:
    enabled: true
    create-schemas: true
    default-schema: app
    schemas: app
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 26MB

server:
  port: ${SERVER_PORT:8088}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO

studyflow:
  ai:
    enabled: ${AI_SERVICE_ENABLED:false}
    base-url: ${AI_SERVICE_URL:http://127.0.0.1:8001}
    service-token: ${AI_SERVICE_TOKEN:}
    connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_READ_TIMEOUT:45s}
    allow-insecure-local-storage-url: ${AI_ALLOW_INSECURE_LOCAL_STORAGE_URL:false}
    document-scan-delay: ${AI_DOCUMENT_SCAN_DELAY:10000}
  assignments:
    attachment-cleanup-delay: ${STUDYFLOW_ASSIGNMENT_ATTACHMENT_CLEANUP_DELAY:60000}
  dev:
    sample-students:
      enabled: ${STUDYFLOW_DEV_SAMPLE_STUDENTS_ENABLED:false}
  cors:
    allowed-origins: ${STUDYFLOW_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  storage:
    enabled: ${STORAGE_ENABLED:false}
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:documents}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
  notifications:
    reminder-scan-delay: ${STUDYFLOW_REMINDER_SCAN_DELAY:60000}
    email-scan-delay: ${STUDYFLOW_EMAIL_SCAN_DELAY:60000}
  auth:
    allowed-email-domain: ${STUDYFLOW_ALLOWED_EMAIL_DOMAIN:stu.ptit.edu.vn}
    otp-ttl: ${STUDYFLOW_OTP_TTL:10m}
    resend-cooldown: ${STUDYFLOW_OTP_RESEND_COOLDOWN:60s}
    max-verification-attempts: ${STUDYFLOW_OTP_MAX_ATTEMPTS:5}
    access-token-ttl: ${STUDYFLOW_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${STUDYFLOW_REFRESH_TOKEN_TTL:30d}
    jwt-issuer: ${STUDYFLOW_JWT_ISSUER:studyflow}
    jwt-secret: ${JWT_SECRET}
    cookie-secure: ${STUDYFLOW_COOKIE_SECURE:true}
    mail-from: ${MAIL_FROM}
