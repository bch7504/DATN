[project]
name = "studyflow-ai"
version = "0.1.0"
description = "Internal Python AI service for StudyFlow"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.15,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "openai>=1.75,<3.0",
    "pgvector>=0.4,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pypdf>=5.4,<7.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "reportlab>=4.4,<5.0",
    "ruff>=0.11,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
